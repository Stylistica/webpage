<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneha Makini</title>
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  p.tagline { font-size: 1.1rem; letter-spacing: 0.02em; margin: 0 0 2.5rem; }
  .portrait-wrap { position: relative; }
  .me { max-width: 280px; width: 65vw; height: auto; display: block; }
  .hat {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .hat.on { opacity: 1; }
  #hat-beanie { left: 18%; top: -2%; width: 64%; }
  #hat-cap    { left: 18%; top: -2%; width: 64%; }
  #hat-beret  { left: 23%; top: -4%; width: 60%; transform: rotate(-10deg); }
  h1.name { font-size: 1.3rem; font-weight: 600; margin: 2rem 0 0.25rem; }
  p.email { margin: 0; font-size: 0.95rem; }
  a { color: #1a1a1a; }
  .hats {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.6rem;
  }
  .hat-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    color: inherit;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    opacity: 0.7;
    transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .hat-btn:hover, .hat-btn:focus-visible { opacity: 1; }
  .hat-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .hat-btn[aria-pressed="true"] {
    opacity: 1;
    border-color: currentColor;
    background: rgba(128, 128, 128, 0.10);
  }
  .hat-btn svg { width: 42px; height: auto; display: block; }
  @media (prefers-reduced-motion: reduce) {
    .hat { transition: none; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #e8e8e8; }
    a { color: #e8e8e8; }
  }
</style>
</head>
<body>

    <circle cx="120" cy="52" r="5" fill="#2f343d"/>
    <path d="M120 52 C165 55 200 56 210 62 C214 65 213 70 213 76 L213 94" fill="none" stroke="#c19a3f" stroke-width="4" stroke-linecap="round"/>

    <path d="M50 52 C62 32 100 26 130 32 C104 37 72 44 60 60 Z" fill="#c0735c" opacity="0.6"/>

<p class="tagline">Programmer. Researcher. Product Designer.</p>
<div class="portrait-wrap">
  <canvas class="me" id="portrait" role="img" aria-label="Portrait of Sneha"></canvas>
  <svg class="hat" id="hat-beanie" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beanie"/></svg>
  <svg class="hat" id="hat-cap" viewBox="0 0 240 130" aria-hidden="true"><use href="#art-cap"/></svg>
  <svg class="hat" id="hat-beret" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beret"/></svg>
  <noscript><img class="me" src="me.png" alt=""></noscript>
</div>
<h1 class="name">Sneha</h1>
<p class="email"><a href="mailto:snehapriscilla@gmail.com">snehapriscilla@gmail.com</a></p>

<div class="hats" role="group" aria-label="Try a hat on the portrait">
  <button class="hat-btn" data-hat="beanie" aria-pressed="false">
    <svg viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beanie"/></svg>
    Programmer
  </button>
  <button class="hat-btn" data-hat="cap" aria-pressed="false">
    <svg viewBox="0 0 240 130" aria-hidden="true"><use href="#art-cap"/></svg>
    Researcher
  </button>
  <button class="hat-btn" data-hat="beret" aria-pressed="false">
    <svg viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beret"/></svg>
    Product Designer
  </button>
</div>

<script>
(function () {
  var canvas = document.getElementById('portrait');
  var img = new Image();
  img.src = 'me.png';
  img.onload = function () {
    var w = img.naturalWidth, h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    // Respect reduced-motion: show the final image immediately.
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.drawImage(img, 0, 0);
      return;
    }
    // Pixel reveal: coarse mosaic that doubles in resolution until sharp.
    var steps = [];
    for (var s = 8; s < w; s *= 2) steps.push(s);
    steps.push(w);
    var duration = 2500; // ms total, plays once
    var interval = duration / steps.length;
    var i = 0;
    function drawStep() {
      ctx.clearRect(0, 0, w, h);
      var sw = steps[i];
      var sh = Math.max(1, Math.round(sw * h / w));
      var off = document.createElement('canvas');
      off.width = sw;
      off.height = sh;
      off.getContext('2d').drawImage(img, 0, 0, sw, sh);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, sw, sh, 0, 0, w, h);
      i++;
      if (i < steps.length) setTimeout(drawStep, interval);
    }
    drawStep();
  };
})();

(function () {
  var current = null;
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.hat-btn'));
  var layers = Array.prototype.slice.call(document.querySelectorAll('.hat'));
  function setHat(name) {
    current = (current === name) ? null : name;
    layers.forEach(function (layer) {
      layer.classList.toggle('on', layer.id === 'hat-' + current);
    });
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.hat === current));
    });
  }
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { setHat(btn.dataset.hat); });
  });
})();
</script>

</body>
</html>

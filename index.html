<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sneha Makini</title>
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  .portrait-wrap { position: relative; }
  .me { max-width: 280px; width: 65vw; height: auto; display: block; }
  .hat {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .hat.on { opacity: 1; }
  #hat-beanie { left: 10%; top: -4%; width: 76%; transform: rotate(-4deg); }
  #hat-cap    { left: 17%; top: -1%; width: 62%; transform: rotate(-3deg); }
  #hat-beret  { left: 17%; top: -1%; width: 58%; transform: rotate(-12deg); }
  .hat.hat-fly {
    position: fixed;
    margin: 0;
    z-index: 10;
    opacity: 1;
    transition: none;
  }
  .hat.hat-fly.hat-fly-go {
    transition: left 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                top 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                width 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  h1.name { font-size: 1.3rem; font-weight: 600; margin: 2rem 0 0.25rem; }
  p.email { margin: 0; font-size: 0.95rem; }
  a { color: #1a1a1a; }
  .hats {
    display: flex;
    gap: 0.8rem;
    margin: 0 0 2.5rem;
  }
  .hat-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    color: inherit;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    opacity: 0.7;
    transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .hat-btn:hover, .hat-btn:focus-visible { opacity: 1; }
  .hat-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .hat-btn[aria-pressed="true"] {
    opacity: 1;
    border-color: currentColor;
    background: rgba(128, 128, 128, 0.10);
  }
  .hat-btn svg { width: 42px; height: auto; display: block; }
  @media (prefers-reduced-motion: reduce) {
    .hat { transition: none; }
    .hat.hat-fly.hat-fly-go { transition: none; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #e8e8e8; }
    a { color: #e8e8e8; }
  }
</style>
</head>
<body>

<div class="hats" role="group" aria-label="Try a hat on the portrait">
  <button class="hat-btn" data-hat="beanie" aria-pressed="false">
    <svg viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beanie"/></svg>
    Programmer
  </button>
  <button class="hat-btn" data-hat="cap" aria-pressed="false">
    <svg viewBox="0 0 220 120" aria-hidden="true"><use href="#art-cap"/></svg>
    Researcher
  </button>
  <button class="hat-btn" data-hat="beret" aria-pressed="false">
    <svg viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beret"/></svg>
    Product Designer
  </button>
</div>

<div class="portrait-wrap">
  <canvas class="me" id="portrait" role="img" aria-label="Portrait of Sneha"></canvas>
  <svg class="hat" id="hat-beanie" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beanie"/></svg>
  <svg class="hat" id="hat-cap" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-cap"/></svg>
  <svg class="hat" id="hat-beret" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beret"/></svg>
  <noscript><img class="me" src="me.png" alt=""></noscript>
</div>
<h1 class="name">Sneha</h1>
<p class="email"><a href="mailto:snehapriscilla@gmail.com">snehapriscilla@gmail.com</a></p>

<script>
(function () {
  var canvas = document.getElementById('portrait');
  var img = new Image();
  img.src = 'me.png';
  img.onload = function () {
    var w = img.naturalWidth, h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    // Respect reduced-motion: show the final image immediately.
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.drawImage(img, 0, 0);
      return;
    }
    // Pixel reveal: coarse mosaic that doubles in resolution until sharp.
    var steps = [];
    for (var s = 8; s < w; s *= 2) steps.push(s);
    steps.push(w);
    var duration = 2500; // ms total, plays once
    var interval = duration / steps.length;
    var i = 0;
    function drawStep() {
      ctx.clearRect(0, 0, w, h);
      var sw = steps[i];
      var sh = Math.max(1, Math.round(sw * h / w));
      var off = document.createElement('canvas');
      off.width = sw;
      off.height = sh;
      off.getContext('2d').drawImage(img, 0, 0, sw, sh);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, sw, sh, 0, 0, w, h);
      i++;
      if (i < steps.length) setTimeout(drawStep, interval);
    }
    drawStep();
  };
})();

(function () {
  var current = null;
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.hat-btn'));
  var layers = Array.prototype.slice.call(document.querySelectorAll('.hat'));

  function layer(name) { return document.getElementById('hat-' + name); }
  function btnIcon(name) { return document.querySelector('.hat-btn[data-hat="' + name + '"] svg'); }

  // The layer's on-head geometry, ignoring its tilt, in viewport coords.
  function headGeometry(l) {
    var cs = getComputedStyle(l);
    var tf = cs.transform === 'none' ? '' : cs.transform;
    var prev = l.style.cssText;
    l.style.transition = 'none';
    l.style.transform = 'none';
    var r = l.getBoundingClientRect();
    l.style.cssText = prev;
    return { rect: r, transform: tf };
  }

  function place(el, r, tf) {
    el.style.left = r.left + 'px';
    el.style.top = r.top + 'px';
    el.style.width = r.width + 'px';
    el.style.transform = tf || 'none';
  }

  function makeFly(name) {
    var c = layer(name).cloneNode(true);
    c.removeAttribute('id');
    c.classList.remove('on');
    c.classList.add('hat-fly');
    document.body.appendChild(c);
    return c;
  }

  function flyToHead(name) {
    var l = layer(name);
    var from = btnIcon(name).getBoundingClientRect();
    var fin = headGeometry(l);
    var c = makeFly(name);
    place(c, from, null);
    c.getBoundingClientRect(); // reflow so the transition takes
    c.classList.add('hat-fly-go');
    place(c, fin.rect, fin.transform);
    var called = false;
    var done = function () {
      if (called) return;
      called = true;
      // Show the real layer instantly (no opacity fade) so the hat doesn't blink after landing.
      l.style.transition = 'none';
      l.classList.add('on');
      l.getBoundingClientRect();
      l.style.transition = '';
      c.remove();
    };
    c.addEventListener('transitionend', done);
    setTimeout(done, 800);
  }

  function flyToPicker(name) {
    var l = layer(name);
    var fin = headGeometry(l);
    var to = btnIcon(name).getBoundingClientRect();
    l.style.transition = 'none';
    l.classList.remove('on');
    l.getBoundingClientRect();
    l.style.transition = '';
    var c = makeFly(name);
    place(c, fin.rect, fin.transform);
    c.getBoundingClientRect();
    c.classList.add('hat-fly-go');
    place(c, to, null);
    var called = false;
    var done = function () {
      if (called) return;
      called = true;
      c.remove();
    };
    c.addEventListener('transitionend', done);
    setTimeout(done, 800);
  }

  function setHat(name) {
    var takingOff = (current === name);
    var prev = current;
    current = takingOff ? null : name;
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.hat === current));
    });
    if (reduceMotion) {
      layers.forEach(function (l) { l.classList.toggle('on', l.id === 'hat-' + current); });
      return;
    }
    if (prev && prev !== name) layer(prev).classList.remove('on'); // swap: old one fades out
    if (takingOff) flyToPicker(prev);
    else flyToHead(name);
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { setHat(btn.dataset.hat); });
  });
})();
</script>

</body>
</html>

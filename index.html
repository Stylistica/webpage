<!DOCTYPE html>

<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  .portrait-wrap { position: relative; touch-action: pan-y; }
  .me { max-width: 280px; width: 65vw; height: auto; display: block; }
  .hat {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .hat.on { opacity: 1; }
  #hat-beanie { left: 15%; top: -3%; width: 70%; transform: rotate(-2deg); }
  #hat-cap    { left: 10%; top: -5%; width: 79%; transform: rotate(-2deg); }
  #hat-beret  { left: 17%; top: -1%; width: 58%; transform: rotate(-12deg); }
  .hat.hat-fly {
    position: fixed;
    margin: 0;
    z-index: 10;
    opacity: 1;
    transition: none;
  }
  .hat.hat-fly.hat-fly-go {
    transition: left 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                top 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                width 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  h1.name { font-size: 1.3rem; font-weight: 600; margin: 2rem 0 0.25rem; }
  p.email { margin: 0; font-size: 0.95rem; }
  a { color: #1a1a1a; }
  .hats {
    display: flex;
    gap: 0.8rem;
    margin: 0 0 2.5rem;
  }
  .hat-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    color: inherit;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    opacity: 0.7;
    transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .hat-btn:hover, .hat-btn:focus-visible { opacity: 1; }
  .hat-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .hat-btn[aria-pressed="true"] {
    opacity: 1;
    border-color: currentColor;
    background: rgba(128, 128, 128, 0.10);
  }
  .hat-btn svg { width: 42px; height: auto; display: block; }
  @keyframes prop-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #hat-beanie .prop { transform-box: fill-box; transform-origin: center; }
  #hat-beanie.spinning .prop {
    animation: prop-spin 0.9s linear 4;
    transform-box: fill-box;
    transform-origin: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .hat { transition: none; }
    #hat-beanie.spinning .prop { animation: none; }
    .hat.hat-fly.hat-fly-go { transition: none; }
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #e8e8e8; }
    a { color: #e8e8e8; }
  }
</style>
</head>

<div class="portrait-wrap">
  <canvas class="me" id="portrait" role="img" aria-label="Portrait of Sneha"></canvas>
  <svg class="hat" id="hat-beanie" viewBox="0 0 220 120" aria-hidden="true">
    <rect x="99" y="9" width="7" height="18" rx="3" fill="#9a9a9a"/>
    <g class="prop">
      <ellipse cx="70" cy="9" rx="27" ry="8" fill="#EA4335" transform="rotate(-6 70 9)"/>
      <ellipse cx="136" cy="9" rx="27" ry="8" fill="#FBBC05" transform="rotate(6 136 9)"/>
    </g>
    <circle cx="103" cy="10" r="6" fill="#4285F4"/>
    <path d="M103 26 C56 29 33 56 31 89 L67 89 C69 62 83 39 103 26 Z" fill="#4285F4"/>
    <path d="M103 26 C83 39 69 62 67 89 L106 89 C105 66 104 43 103 26 Z" fill="#EA4335"/>
    <path d="M103 26 C104 43 105 66 106 89 L141 89 C139 62 125 37 103 26 Z" fill="#FBBC05"/>
    <path d="M103 26 C125 37 139 62 141 89 L173 89 C173 56 149 29 103 26 Z" fill="#34A853"/>
    <path d="M48 60 C58 42 80 33 100 34 C84 42 62 52 53 70 Z" fill="#ffffff" opacity="0.35"/>
    <path d="M31 89 C33 56 56 29 103 26 C149 29 173 56 173 89 L31 89" fill="none" stroke="#3a3a3a" stroke-width="3" opacity="0.45"/>
    <path d="M103 26 C83 39 69 62 67 89 M103 26 C104 43 105 66 106 89 M103 26 C125 37 139 62 141 89" fill="none" stroke="#3a3a3a" stroke-width="2" opacity="0.3"/>
  </svg>
  <svg class="hat" id="hat-cap" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-cap"/></svg>
  <svg class="hat" id="hat-beret" viewBox="0 0 220 120" aria-hidden="true"><use href="#art-beret"/></svg>
  <noscript><img class="me" src="me.png" alt=""></noscript>
</div>
<h1 class="name">Sneha</h1>
<p class="email"><a href="mailto:snehapriscilla@gmail.com">snehapriscilla@gmail.com</a></p>

<script>
(function () {
  var canvas = document.getElementById('portrait');
  var img = new Image();
  img.src = 'me.png';
  img.onload = function () {
    var w = img.naturalWidth, h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d');
    // Respect reduced-motion: show the final image immediately.
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.drawImage(img, 0, 0);
      return;
    }
    // Pixel reveal: coarse mosaic that doubles in resolution until sharp.
    var steps = [];
    for (var s = 8; s < w; s *= 2) steps.push(s);
    steps.push(w);
    var duration = 2500; // ms total, plays once
    var interval = duration / steps.length;
    var i = 0;
    function drawStep() {
      ctx.clearRect(0, 0, w, h);
      var sw = steps[i];
      var sh = Math.max(1, Math.round(sw * h / w));
      var off = document.createElement('canvas');
      off.width = sw;
      off.height = sh;
      off.getContext('2d').drawImage(img, 0, 0, sw, sh);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, sw, sh, 0, 0, w, h);
      i++;
      if (i < steps.length) setTimeout(drawStep, interval);
    }
    drawStep();
  };
})();

(function () {
  var current = null;
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.hat-btn'));
  var layers = Array.prototype.slice.call(document.querySelectorAll('.hat'));

  function layer(name) { return document.getElementById('hat-' + name); }
  function btnIcon(name) { return document.querySelector('.hat-btn[data-hat="' + name + '"] svg'); }

  var beanieLayer = layer('beanie');
  var spinTimer = null;
  function stopSpin() {
    clearTimeout(spinTimer);
    beanieLayer.classList.remove('spinning');
  }
  function spinProp() {
    if (reduceMotion) return;
    beanieLayer.classList.remove('spinning');
    beanieLayer.getBoundingClientRect(); // reflow so the animation restarts
    beanieLayer.classList.add('spinning');
    clearTimeout(spinTimer);
    spinTimer = setTimeout(stopSpin, 900 * 4 + 150); // 4 turns, then stop
  }

  // The layer's on-head geometry, ignoring its tilt, in viewport coords.
  function headGeometry(l) {
    var cs = getComputedStyle(l);
    var tf = cs.transform === 'none' ? '' : cs.transform;
    var prev = l.style.cssText;
    l.style.transition = 'none';
    l.style.transform = 'none';
    var r = l.getBoundingClientRect();
    l.style.cssText = prev;
    return { rect: r, transform: tf };
  }

  function place(el, r, tf) {
    el.style.left = r.left + 'px';
    el.style.top = r.top + 'px';
    el.style.width = r.width + 'px';
    el.style.transform = tf || 'none';
  }

  function makeFly(name) {
    var c = layer(name).cloneNode(true);
    c.removeAttribute('id');
    c.classList.remove('on');
    c.classList.remove('spinning');
    c.classList.add('hat-fly');
    document.body.appendChild(c);
    return c;
  }

  function flyToHead(name) {
    var l = layer(name);
    var from = btnIcon(name).getBoundingClientRect();
    var fin = headGeometry(l);
    var c = makeFly(name);
    place(c, from, null);
    c.getBoundingClientRect(); // reflow so the transition takes
    c.classList.add('hat-fly-go');
    place(c, fin.rect, fin.transform);
    var called = false;
    var done = function () {
      if (called) return;
      called = true;
      // Show the real layer instantly (no opacity fade) so the hat doesn't blink after landing.
      l.style.transition = 'none';
      l.classList.add('on');
      l.getBoundingClientRect();
      l.style.transition = '';
      c.remove();
      if (name === 'beanie') spinProp();
    };
    c.addEventListener('transitionend', done);
    setTimeout(done, 800);
  }

  function flyToPicker(name) {
    var l = layer(name);
    var fin = headGeometry(l);
    var to = btnIcon(name).getBoundingClientRect();
    l.style.transition = 'none';
    l.classList.remove('on');
    l.getBoundingClientRect();
    l.style.transition = '';
    var c = makeFly(name);
    place(c, fin.rect, fin.transform);
    c.getBoundingClientRect();
    c.classList.add('hat-fly-go');
    place(c, to, null);
    var called = false;
    var done = function () {
      if (called) return;
      called = true;
      c.remove();
    };
    c.addEventListener('transitionend', done);
    setTimeout(done, 800);
  }

  function setHat(name) {
    stopSpin();
    var takingOff = (current === name);
    var prev = current;
    current = takingOff ? null : name;
    buttons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.hat === current));
    });
    if (reduceMotion) {
      layers.forEach(function (l) { l.classList.toggle('on', l.id === 'hat-' + current); });
      return;
    }
    if (prev && prev !== name) layer(prev).classList.remove('on'); // swap: old one fades out
    if (takingOff) flyToPicker(prev);
    else flyToHead(name);
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () { setHat(btn.dataset.hat); });
  });

  // Swipe-to-spin: flick across the propeller like a fidget spinner, with momentum.
  var prop = beanieLayer.querySelector('.prop');
  var wrap = document.querySelector('.portrait-wrap');
  var spinAngle = 0, spinVel = 0, spinRaf = null;
  var dragState = null;

  function propAngleNow() {
    var tf = getComputedStyle(prop).transform;
    if (tf && tf !== 'none') {
      var m = tf.match(/matrix\(([^)]+)\)/);
      if (m) {
        var p = m[1].split(',').map(parseFloat);
        return Math.atan2(p[1], p[0]) * 180 / Math.PI;
      }
    }
    return spinAngle;
  }

  function applySpin() {
    prop.style.transform = 'rotate(' + spinAngle + 'deg)';
  }

  function spinStep(ts) {
    if (spinRaf === null) return;
    var dt = Math.min(0.05, (ts - spinStep.last) / 1000);
    spinStep.last = ts;
    spinAngle += spinVel * dt;
    spinVel *= Math.exp(-dt / 1.5); // friction: gentle momentum decay
    if (Math.abs(spinVel) < 30) { spinVel = 0; spinRaf = null; return; }
    applySpin();
    spinRaf = requestAnimationFrame(spinStep);
  }

  function startInertia(v) {
    spinVel = v;
    if (spinRaf === null) {
      spinRaf = requestAnimationFrame(function (ts) { spinStep.last = ts; spinStep(ts); });
    }
  }

  function pointerAngle(e) {
    var r = prop.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  }

  function overProp(e) {
    var r = prop.getBoundingClientRect();
    var padX = r.width * 0.2 + 10, padY = r.height * 1.2 + 10;
    return e.clientX >= r.left - padX && e.clientX <= r.right + padX &&
           e.clientY >= r.top - padY && e.clientY <= r.bottom + padY;
  }

  wrap.addEventListener('pointerdown', function (e) {
    if (current !== 'beanie' || reduceMotion || !overProp(e)) return;
    stopSpin(); // hand off from the landing burst to direct control
    spinAngle = propAngleNow();
    spinVel = 0;
    applySpin();
    dragState = { last: pointerAngle(e), trail: [[performance.now(), spinAngle]] };
    if (wrap.setPointerCapture) {
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  });

  wrap.addEventListener('pointermove', function (e) {
    if (!dragState) return;
    var a = pointerAngle(e);
    var d = a - dragState.last;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    dragState.last = a;
    spinAngle += d;
    applySpin();
    dragState.trail.push([performance.now(), spinAngle]);
    if (dragState.trail.length > 6) dragState.trail.shift();
  });

  function endDrag() {
    if (!dragState) return;
    var trail = dragState.trail;
    dragState = null;
    var now = performance.now();
    var old = trail[0], i;
    for (i = trail.length - 1; i >= 0; i--) {
      if (now - trail[i][0] > 120) { old = trail[i]; break; }
    }
    var v = 0;
    var lastPt = trail[trail.length - 1];
    if (now > old[0]) v = (lastPt[1] - old[1]) / ((now - old[0]) / 1000);
    v = Math.max(-4000, Math.min(4000, v));
    if (Math.abs(v) > 30) startInertia(v);
  }
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', endDrag);
})();
</script>

</body>
</html>
